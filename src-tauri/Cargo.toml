[package]
name = "cadence"
version = "0.1.1"
edition = "2021"
rust-version = "1.77"
description = "A fast, native Spotify desktop client with a CLI, 10-band EQ, and Discord Rich Presence."
license = "MIT"
repository = "https://github.com/ratph6/cadence"
homepage = "https://github.com/ratph6/cadence"
authors = ["ratph6"]

[lib]
name = "cadence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

keyring = { version = "3", features = ["apple-native", "windows-native"] }
url = "2"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
once_cell = "1"
dirs = "5"
cpal = "0.15"
ringbuf = "0.4"
discord-rich-presence = "0.2"
memory-stats = "1"

[target.'cfg(target_os = "windows")'.dependencies]
# DWM corner-preference API. Tauri's frameless transparent windows show
# square corners on Win11 by default; we call DwmSetWindowAttribute with
# DWMWCP_ROUND on the CLI window so the OS-level Acrylic/Mica blur clips
# to a rounded pill instead of bleeding into the surrounding rectangle.
windows-sys = { version = "0.59", features = ["Win32_Graphics_Dwm", "Win32_Foundation"] }

# NOTE: the release profile lives in the workspace-root Cargo.toml. Cargo
# ignores `[profile.*]` declared in a non-root member crate (it emits a
# warning and silently drops the settings), so keeping it here would mean the
# LTO/strip/opt-level/panic tuning never reaches release builds.
