name: release

# Triggers:
#   - Push a tag like v0.1.0 (or v0.1.0-rc.1) to build + draft a Release.
#   - workflow_dispatch lets you run it manually from the Actions tab without tagging.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal macOS binary (one .dmg for both Apple Silicon and Intel).
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # universal-apple-darwin needs both arches.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend deps
        run: npm ci

      - name: Build + bundle + draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Cadence ${{ github.ref_name }}"
          releaseBody: |
            ## What's changed in v0.1.1

            Hardening release focused on security, stability, and open-source readiness.

            ### Security
            - API proxy now refuses to attach your Spotify token to any non-`spotify.com` host
            - Plugin loader is off by default, opt-in only, and restricted to `https`/local sources
            - Theme `@import` fetches restricted to `https`
            - Tightened Content-Security-Policy (removed `unsafe-inline` from `script-src`)

            ### Fixes
            - Login no longer hangs on a second attempt or an abandoned browser flow (added a timeout)
            - Fixed a clock-edge crash in token handling
            - Local audio pipeline: fixed a double-start race and an EQ-contention crash on the audio thread
            - librespot backend reaps a dead receiver process instead of reporting it as running
            - auto-DJ: fixed liked-songs random-pick bias; removed dead code
            - Release builds now actually apply the size/LTO optimizations (the profile was being silently ignored), and ship without debug logging — smaller, faster binaries

            ### Project
            - Added `LICENSE` (MIT), `CONTRIBUTING.md`, `SECURITY.md`, `CODE_OF_CONDUCT.md`
            - Package metadata + README improvements

            ---

            ## Install

            **Windows**: download the `.msi` (or `.exe`) and run it. Unsigned, so Windows SmartScreen will warn you — click *More info* → *Run anyway*.

            **macOS**: download the `.dmg`, drag Cadence into Applications. Unsigned, so the first launch needs right-click → *Open*. If macOS says it's "damaged", run this in Terminal:
            ```
            xattr -dr com.apple.quarantine /Applications/Cadence.app
            ```

            ## Requirements
            - Spotify Premium account
            - A Spotify Developer client_id (free): create one at https://developer.spotify.com/dashboard, add `http://127.0.0.1:53127/callback` as a redirect URI, paste the client_id into Cadence's login screen on first launch
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
